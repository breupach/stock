<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1c3d7a" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" />
    <title>Stock</title>
    <script>
      // Pone el modo oscuro antes de pintar, para que no parpadee en claro. Misma regla que src/lib/tema.js.
      try {
        var t = localStorage.getItem('stock.tema')
        var oscuro = t ? t === 'oscuro' : matchMedia('(prefers-color-scheme: dark)').matches
        if (oscuro && !location.pathname.startsWith('/admin')) document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
